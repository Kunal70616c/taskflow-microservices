spring.application.name=user-service
server.port=8081

# Database connection
spring.datasource.url=jdbc:postgresql://localhost:5432/taskflow
spring.datasource.username=taskflow_user
spring.datasource.password=taskflow_pass

# JPA/Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=user_service

# Create schema if it doesn't exist
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

# JWT configuration
jwt.secret=taskflow-secret-key-change-in-production-min-256-bits-long
jwt.expiration=86400000

# Error messages (for debugging)
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on_param
server.error.include-exception=true